# 통합 도용 탐지 설정. 경로는 모두 이 파일이 있는 폴더(copyright_detection/) 기준 상대경로.
# 보호 DB 넣는 법: copyright_database/README.md

gpu: 0                     # -1 이면 CPU
suspect_dir: suspect_data           # 검사할 영상. --video 없이 실행하면 이 폴더의 영상을 모두 검사
output_root: results                # 결과: results/<영상 이름>/report.txt, 전체 요약: results/summary.txt
cache_dir: cache                    # DB 특징 캐시 (지워도 다음 실행 때 다시 만들어짐)

# ------------------------------------------------------------------ 모달리티별 DB / 실행 옵션
motion:
  enabled: true
  db_dir: copyright_database/motion    # *.npz (SMPL) 또는 영상(*.mp4 등) -> 영상은 자동으로 npz 변환 후 캐시
  hybrik_root: third_party/HybrIK
  workers: 32
face:
  enabled: true
  db_dir: copyright_database/face      # face/<인물>/*.mp4|*.jpg|*.png
avatar:
  enabled: true
  db_root: copyright_database/avatar   # avatar/<인물>/*.mp4 (폴더 하나 = 인물 하나, 영상 하나 = 시점 하나)
  pattern: "*.mp4"
  db_view: cam00           # 이 이름으로 시작하는 시점끼리만 비교. 해당 시점이 없는 인물은 모든 시점과 비교
audio:
  enabled: true
  db_dir: copyright_database/audio     # 보호 음원 (영상/음원 모두 가능: mp4 mov mkv wav mp3 flac m4a ...)
  min_rms_db: -45          # 오디오 트랙이 있어도 이보다 조용하면 '음악 없음'으로 처리

# ------------------------------------------------------------------ 점수 정규화
# 원점수는 모달리티마다 척도가 다르다. 각 모달리티 점수를 '증거 점수'(0~100)로 바꾼다.
#   raw <= floor -> 0,  raw == review -> 35 (검토 필요, 선택),  raw == tau -> 50 (도용 의심),  raw >= high -> 100
# 모듈 자체 기준이 있으면 그대로 사용. 값은 잠정값 (README_RUN.md 의 '임계값 근거' 참고)
normalize:
  motion: {floor: 60, review: 64, tau: 68, high: 80}   # Overall. 관련 없는 영상도 DB 1위가 58~62
  motion_margin: {floor: 1.5, review: 2.5, tau: 4.5, high: 10}   # 1위 - 2위(다른 DB 모션). 무관 0.4~1.1, 복제 15~17
  face:   {floor: 0,  tau: 50, high: 100}              # face_identity.py 점수가 이미 tau=50 으로 보정됨
  avatar_id:     {floor: 40, tau: 70, high: 90}        # S_id   (avatar 모듈 기준 70)
  avatar_appear: {floor: 50, tau: 75, high: 92}        # S_appear (avatar 모듈 기준 75)
  audio:  {floor: 25, review: 40, tau: 70, high: 90}   # track_score (audio 모듈 기준: 검토 40, 높음 70)

# ------------------------------------------------------------------ 판정
fusion:
  weights: {motion: 1.0, face: 1.0, avatar: 1.0}   # 증거 점수에 곱하는 가중치 (vision)
  suspect: 50              # 가중 증거 점수가 이 이상인 모달리티 = 도용 모달리티
  review: 35               # 이 이상이면 '검토 필요'
  include_audio_in_final: false   # 오디오는 별도 판정 (true면 최종 판정에도 포함)

# ------------------------------------------------------------------ 설명 생성 (LLM)
llm:
  enabled: true
  model_dir: weights/llm/Qwen2.5-7B-Instruct   # Apache-2.0, fp16 약 15GB VRAM
  max_new_tokens: 450
